name: finpulse

# Shared environment for the PHP services (api + scheduler).
x-api-env: &api-env
  APP_ENV: prod
  APP_DEBUG: "false"
  DATABASE_DSN: ${DATABASE_DSN:?Set DATABASE_DSN in .env}
  DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  JWT_TTL: ${JWT_TTL:-3600}
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
  RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
  AI_RATE_LIMIT_MAX: ${AI_RATE_LIMIT_MAX:-5}
  AI_RATE_LIMIT_WINDOW: ${AI_RATE_LIMIT_WINDOW:-60}
  AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-50}
  AI_WORKER_URL: ${AI_WORKER_URL:-http://ai-worker:8000}
  BACEN_BASE_URL: ${BACEN_BASE_URL:-https://api.bcb.gov.br}
  BACEN_CACHE_TTL: ${BACEN_CACHE_TTL:-3600}
  COINBASE_BASE_URL: ${COINBASE_BASE_URL:-https://api.coinbase.com}
  CRYPTO_CACHE_TTL: ${CRYPTO_CACHE_TTL:-60}
  ALERTS_INTERVAL: ${ALERTS_INTERVAL:-300}
  COLLECTOR_INTERVAL: ${COLLECTOR_INTERVAL:-21600}
  ALERTS_COOLDOWN: ${ALERTS_COOLDOWN:-3600}
  MAIL_HOST: ${MAIL_HOST:-mailpit}
  MAIL_PORT: ${MAIL_PORT:-1025}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
  MAIL_FROM: ${MAIL_FROM:-alerts@finpulse.dev}
  WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}

x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    build: ./infra/gateway
    depends_on:
      - api
      - web
    logging: *bounded-logs
    restart: unless-stopped
    networks:
      default:
      web-proxy:
        aliases:
          - finpulse-gateway

  api:
    mem_limit: 1g
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    build: ./services/api
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ai-worker:
        condition: service_healthy
    logging: *bounded-logs
    restart: unless-stopped

  # Collects normalized economic history independently from HTTP requests.
  collector:
    mem_limit: 256m
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    build: ./services/api
    # Docker daemon restarts do not wait for Compose dependency healthchecks.
    command: >-
      sh -c 'while true; do
      if php bin/console indicators:collect; then
      sleep "$${COLLECTOR_INTERVAL:-21600}";
      else sleep 30; fi; done'
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    logging: *bounded-logs
    restart: unless-stopped

  # Runs alerts:check on an interval so stored alerts fire automatically.
  scheduler:
    mem_limit: 256m
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    build: ./services/api
    command: sh -c 'while true; do php bin/console alerts:check; sleep "$${ALERTS_INTERVAL:-300}"; done'
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    logging: *bounded-logs
    restart: unless-stopped

  ai-worker:
    build: ./services/ai-worker
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    logging: *bounded-logs
    restart: unless-stopped

  web:
    build: ./services/web
    logging: *bounded-logs
    restart: unless-stopped

  db:
    image: postgres:16.15-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finpulse}
      POSTGRES_USER: ${POSTGRES_USER:-finpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finpulse}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *bounded-logs
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    logging: *bounded-logs
    restart: unless-stopped

  # Local SMTP sink — captures alert emails; web UI exposed in dev (see override).
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    logging: *bounded-logs
    restart: unless-stopped

volumes:
  db-data:

networks:
  web-proxy:
    name: web-proxy
    external: true
