# Development overrides: bind mounts, debug settings and local-only ports.
# Load explicitly with: docker compose -f docker-compose.yml -f compose.dev.yml
services:
  gateway:
    ports:
      - "127.0.0.1:8080:80"

  api:
    environment:
      APP_ENV: dev
      APP_DEBUG: "true"
      XDEBUG_MODE: debug
      XDEBUG_CONFIG: "client_host=host.docker.internal"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./services/api:/var/www/html

  scheduler:
    volumes:
      - ./services/api:/var/www/html

  ai-worker:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./services/ai-worker:/app
    ports:
      - "127.0.0.1:8000:8000"

  web:
    volumes:
      - ./services/web/index.html:/usr/share/nginx/html/index.html:ro
      - ./services/web/src:/usr/share/nginx/html/src:ro
      - ./services/web/assets:/usr/share/nginx/html/assets:ro
    ports:
      - "127.0.0.1:8081:80" # direct access to the web container (bypassing the gateway)

  db:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  mailpit:
    ports:
      - "127.0.0.1:8025:8025" # Mailpit web UI: captured alert emails
      - "127.0.0.1:1025:1025" # SMTP
