# FinPulse gateway — single public entry point.
#   /api/*  → php-fpm (api service) via FastCGI
#   /*      → web service (static SPA)
# The ai-worker is internal only; the api talks to it over the compose network.

map $http_x_real_ip $client_real_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Resolve Compose service names continuously. Containers receive a new IP
    # when rebuilt, while the gateway may remain running.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:9000;
    set $web_upstream web:80;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 16k;

    # Never let the SPA fallback make sensitive-looking paths appear public.
    location ~ (^|/)\. {
        return 404;
    }

    location ~* (^|/)(docker-compose(?:\.[^/]*)?\.ya?ml|compose(?:\.[^/]*)?\.ya?ml|composer\.(?:json|lock))$ {
        return 404;
    }

    # ── Core API (PHP-FPM) ────────────────────────────────────────────────
    location /api/ {
        fastcgi_pass  $api_upstream;
        fastcgi_index index.php;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        # Preserve the real client IP for the rate-limiter.
        fastcgi_param HTTP_X_REAL_IP  $client_real_ip;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 35s;
    }

    # ── Web frontend ──────────────────────────────────────────────────────
    location / {
        proxy_pass         http://$web_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Accept-Encoding   "";
    }
}
