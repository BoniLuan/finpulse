# FinPulse gateway — single public entry point.
#   /api/*  → php-fpm (api service) via FastCGI
#   /*      → web service (static SPA)
# The ai-worker is internal only; the api talks to it over the compose network.

server {
    listen 80;
    server_name _;

    # Resolve Compose service names continuously. Containers receive a new IP
    # when rebuilt, while the gateway may remain running.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:9000;
    set $web_upstream web:80;

    # ── Core API (PHP-FPM) ────────────────────────────────────────────────
    location /api/ {
        fastcgi_pass  $api_upstream;
        fastcgi_index index.php;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        # Preserve the real client IP for the rate-limiter.
        fastcgi_param HTTP_X_REAL_IP  $remote_addr;
    }

    # ── Web frontend ──────────────────────────────────────────────────────
    location / {
        proxy_pass         http://$web_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
