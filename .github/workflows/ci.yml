name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  api:
    name: api (PHP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress
      - name: Code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Tests
        run: vendor/bin/phpunit

  ai-worker:
    name: ai-worker (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app
      - name: Tests
        run: pytest -q

  web:
    name: web (static JS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: for f in src/*.js; do node --check "$f"; done

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: [api, ai-worker, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        env:
          DATABASE_DSN: "pgsql:host=db;port=5432;dbname=finpulse"
          DATABASE_USER: finpulse
          DATABASE_PASSWORD: finpulse-ci
          REDIS_URL: "tcp://redis:6379"
          JWT_SECRET: ci-only-secret-at-least-32-characters
          POSTGRES_PASSWORD: finpulse-ci
        run: docker compose -f docker-compose.yml build
