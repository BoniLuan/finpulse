# Dev overrides: bind mounts for live code, exposed ports for direct access.
# Loaded automatically by `docker compose` on top of docker-compose.yml.
services:
  api:
    environment:
      APP_ENV: dev
      APP_DEBUG: "true"
      XDEBUG_MODE: debug
      XDEBUG_CONFIG: "client_host=host.docker.internal"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./services/api:/var/www/html

  ai-worker:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./services/ai-worker:/app
    ports:
      - "8000:8000"

  web:
    volumes:
      - ./services/web/index.html:/usr/share/nginx/html/index.html:ro
      - ./services/web/src:/usr/share/nginx/html/src:ro
      - ./services/web/assets:/usr/share/nginx/html/assets:ro
    ports:
      - "8081:80" # direct access to the web container (bypassing the gateway)

  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  mailpit:
    ports:
      - "8025:8025" # Mailpit web UI: captured alert emails
      - "1025:1025" # SMTP
